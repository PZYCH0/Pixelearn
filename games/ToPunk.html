<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

<body>
    <div class="container">

            </div>

                <div class="stat-label">Level</div>
                <div class="level-bar">
                    <div class="level-progress" id="levelProgress"></div>
                </div>

                    <option value="study">📚 Study</option>
                    <option value="create">🎨 Create</option>
                    <option value="rest">🧘 Rest</option>

                </select>
                <button class="add-btn" onclick="addTask()">+ Add Mission</button>
            </div>
        </div>

        <div class="controls">
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterTasks('all', this)">All</button>
                <button class="filter-btn" onclick="filterTasks('study', this)">Study</button>
                <button class="filter-btn" onclick="filterTasks('create', this)">Create</button>
                <button class="filter-btn" onclick="filterTasks('rest', this)">Rest</button>
                <button class="filter-btn" onclick="filterTasks('work', this)">Work</button>
                <button class="filter-btn" onclick="filterTasks('completed', this)">Completed</button>
            </div>
            <button class="sound-toggle" onclick="toggleSound()" id="soundToggle">🔊 Sound ON</button>
        </div>

        <div class="tasks-container" id="tasksContainer">
            <div class="empty-state">
                <div class="icon">🎯</div>
                <p>No missions available. Create your first task to start earning XP!</p>

    <script>
        // Game state
        let tasks = JSON.parse(localStorage.getItem('cyberpunk-tasks')) || [];
        let stats = JSON.parse(localStorage.getItem('cyberpunk-stats')) || {
            totalXP: 0,
            level: 1,
            soundEnabled: true
        };
        let currentFilter = 'all';
        let editingTaskId = null;

        // Sound effects (simple beep sounds using Web Audio API)
        let audioContext = null;
        
        function initAudioContext() {
            if (!audioContext) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.log('Audio not supported');
                }
            }
        }
        
        function playSound(frequency, duration, type = 'sine') {
            if (!stats.soundEnabled || !audioContext) return;
            
            try {
                // Resume audio context if suspended
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
                oscillator.type = type;
                
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            } catch (e) {
                console.log('Sound error:', e);
            }
        }

        // Initialize app
        function init() {
            updateStats();
            renderTasks();
            setupEventListeners();
            setupDragAndDrop();
            
            // Check for daily reset
            const lastReset = localStorage.getItem('cyberpunk-last-reset');
            const today = new Date().toDateString();
            if (lastReset !== today) {
                localStorage.setItem('cyberpunk-last-reset', today);
            }
        }

        function setupEventListeners() {
            const taskInput = document.getElementById('taskInput');
            if (taskInput) {
                taskInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        addTask();
                    }
                });
            }
        }

        function setupDragAndDrop() {
            const tasksContainer = document.getElementById('tasksContainer');
            if (!tasksContainer) return;

            tasksContainer.addEventListener('dragstart', (e) => {
                const taskItem = e.target.closest('.task-item');
                if (taskItem) {
                    taskItem.classList.add('dragging');
                    e.dataTransfer.setData('text/plain', taskItem.dataset.id);
                }
            });

            tasksContainer.addEventListener('dragend', (e) => {
                const taskItem = e.target.closest('.task-item');
                if (taskItem) {
                    taskItem.classList.remove('dragging');
                }
            });

            tasksContainer.addEventListener('dragover', (e) => {
                e.preventDefault();
                const afterElement = getDragAfterElement(tasksContainer, e.clientY);
                const dragging = document.querySelector('.dragging');
                if (afterElement == null) {
                    tasksContainer.appendChild(dragging);
                } else {
                    tasksContainer.insertBefore(dragging, afterElement);
                }
            });

            tasksContainer.addEventListener('drop', (e) => {
                e.preventDefault();
                const taskId = e.dataTransfer.getData('text/plain');
                const draggedTask = tasks.find(task => task.id === taskId);
                const allTasks = Array.from(tasksContainer.querySelectorAll('.task-item'));
                const newIndex = allTasks.findIndex(item => item.dataset.id === taskId);

                // Reorder tasks array
                tasks = tasks.filter(task => task.id !== taskId);
                tasks.splice(newIndex, 0, draggedTask);
                saveTasks();
                renderTasks();
                playSound(600, 0.1);
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.task-item:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function addTask() {
            initAudioContext();
            
            const input = document.getElementById('taskInput');
            const categorySelect = document.getElementById('categorySelect');
            
            if (!input || !categorySelect) {
                console.error('Input elements not found');
                return;
            }
            
            const text = input.value.trim();
            if (!text) {
                showAlert('Please enter a task description!');
                return;
            }

            try {
                if (editingTaskId) {
                    const task = tasks.find(t => t.id === editingTaskId);
                    if (task) {
                        task.text = text;
                        task.category = categorySelect.value;
                        editingTaskId = null;
                        document.querySelector('.add-btn').textContent = '+ Add Mission';
                    }
                } else {
                    const newTask = {
                        id: generateId(),
                        text: text,
                        category: categorySelect.value,
                        completed: false,
                        createdAt: Date.now()
                    };
                    tasks.unshift(newTask);
                }

                input.value = '';
                saveTasks();
                updateStats();
                renderTasks();
                playSound(800, 0.2);
            } catch (error) {
                console.error('Error in addTask:', error);
                showAlert('Error adding task. Please try again.');
            }
        }

        function deleteTask(id) {
            showConfirmDialog('Are you sure you want to delete this mission?', () => {
                tasks = tasks.filter(task => task.id !== id);
                saveTasks();
                updateStats();
                renderTasks();
                playSound(400, 0.3);
            });
        }

        function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                document.getElementById('taskInput').value = task.text;
                document.getElementById('categorySelect').value = task.category;
                editingTaskId = id;
                document.querySelector('.add-btn').textContent = 'Update Mission';
                document.getElementById('taskInput').focus();
            }
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                
                if (task.completed) {
                    const xpReward = Math.floor(Math.random() * 20) + 10; // 10-30 XP
                    stats.totalXP += xpReward;
                    showXPReward(xpReward);
                    playSound(1000, 0.1);
                    setTimeout(() => playSound(1200, 0.1), 100);
                } else {
                    playSound(600, 0.2);
                }
                
                saveTasks();
                updateStats();
                renderTasks();
            }
        }

        function showXPReward(xp) {
            const reward = document.createElement('div');
            reward.className = 'xp-reward';
            reward.textContent = `+${xp} XP`;
            document.body.appendChild(reward);
            
            setTimeout(() => {
                if (reward.parentNode) {
                    document.body.removeChild(reward);
                }
            }, 1500);
        }

        function filterTasks(filter, buttonElement) {
            currentFilter = filter;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            if (buttonElement) {
                buttonElement.classList.add('active');
            }
            
            renderTasks();
            playSound(700, 0.1);
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            if (!container) return;

            let filteredTasks = tasks;
            if (currentFilter !== 'all') {
                if (currentFilter === 'completed') {
                    filteredTasks = tasks.filter(task => task.completed);
                } else {
                    filteredTasks = tasks.filter(task => task.category === currentFilter);
                }
            }

            if (filteredTasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🎯</div>
                        <p>${currentFilter === 'all' ? 'No missions available. Create your first task to start earning XP!' : `No ${currentFilter} missions found.`}</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredTasks.map(task => `
                <div class="task-item ${task.completed ? 'completed' : ''}" draggable="true" data-id="${task.id}">
                    <div class="task-header">
                        <div class="task-content">
                            <div class="task-checkbox ${task.completed ? 'checked' : ''}" onclick="toggleTask('${task.id}')"></div>
                            <div class="task-text ${task.completed ? 'completed' : ''}">${escapeHTML(task.text)}</div>
                        </div>
                        <div class="task-category category-${task.category}">
                            ${getCategoryIcon(task.category)} ${task.category}
                        </div>
                    </div>
                    <div class="task-actions">
                        <button class="task-btn edit-btn" onclick="editTask('${task.id}')">Edit</button>
                        <button class="task-btn delete-btn" onclick="deleteTask('${task.id}')">Delete</button>
                    </div>
                </div>
            `).join('');

            // Re-attach drag-and-drop listeners after rendering
            setupDragAndDrop();
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function getCategoryIcon(category) {
            const icons = {
                study: '📚',
                create: '🎨',
                rest: '🧘',
                work: '💼'
            };
            return icons[category] || '📝';
        }

        function updateStats() {
            const totalTasks = tasks.length;
            const completedTasks = tasks.filter(task => task.completed).length;
            const currentLevel = Math.floor(stats.totalXP / 100) + 1;
            const levelProgress = (stats.totalXP % 100);

            stats.level = currentLevel;

            const totalTasksEl = document.getElementById('totalTasks');
            const completedTasksEl = document.getElementById('completedTasks');
            const currentXPEl = document.getElementById('currentXP');
            const currentLevelEl = document.getElementById('currentLevel');
            const levelProgressEl = document.getElementById('levelProgress');

            if (totalTasksEl) totalTasksEl.textContent = totalTasks;
            if (completedTasksEl) completedTasksEl.textContent = completedTasks;
            if (currentXPEl) currentXPEl.textContent = stats.totalXP;
            if (currentLevelEl) currentLevelEl.textContent = currentLevel;
            if (levelProgressEl) levelProgressEl.style.width = `${levelProgress}%`;

            saveStats();
        }

        function toggleSound() {
            stats.soundEnabled = !stats.soundEnabled;
            const toggle = document.getElementById('soundToggle');
            if (toggle) {
                toggle.textContent = stats.soundEnabled ? '🔊 Sound ON' : '🔇 Sound OFF';
            }
            saveStats();
            
            if (stats.soundEnabled) {
                playSound(800, 0.1);
            }
        }

        function showResetModal() {
            showConfirmDialog('Are you sure you want to reset all data? This action cannot be undone.', () => {
                tasks = [];
                stats = { totalXP: 0, level: 1, soundEnabled: true };
                currentFilter = 'all';
                
                localStorage.removeItem('cyberpunk-tasks');
                localStorage.removeItem('cyberpunk-stats');
                
                updateStats();
                renderTasks();
                
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelector('.filter-btn').classList.add('active');
                
                playSound(400, 0.5);
            });
        }

        function saveTasks() {
            try {
                localStorage.setItem('cyberpunk-tasks', JSON.stringify(tasks));
            } catch (e) {
                console.error('Error saving tasks:', e);
            }
        }

        function saveStats() {
            try {
                localStorage.setItem('cyberpunk-stats', JSON.stringify(stats));
            } catch (e) {
                console.error('Error saving stats:', e);
            }
        }

        function showAlert(message) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 class="modal-title">Alert</h3>
                    </div>
                    <p style="color: var(--text-secondary); margin-bottom: 20px;">${escapeHTML(message)}</p>
                    <div class="modal-buttons">
                        <button class="modal-btn confirm-btn" onclick="this.closest('.modal').remove()">OK</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            playSound(500, 0.2);
        }

        function showConfirmDialog(message, onConfirm) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            
            const modalContent = document.createElement('div');
            modalContent.className = 'modal-content';
            
            modalContent.innerHTML = `
                <div class="modal-header">
                    <h3 class="modal-title">Confirm Action</h3>
                </div>
                <p style="color: var(--text-secondary); margin-bottom: 20px;">${escapeHTML(message)}</p>
                <div class="modal-buttons">
                    <button class="modal-btn cancel-btn">Cancel</button>
                    <button class="modal-btn confirm-btn">Confirm</button>
                </div>
            `;
            
            modal.appendChild(modalContent);
            
            const cancelBtn = modalContent.querySelector('.cancel-btn');
            const confirmBtn = modalContent.querySelector('.confirm-btn');
            
            cancelBtn.addEventListener('click', () => {
                document.body.removeChild(modal);
                playSound(600, 0.1);
            });
            
            confirmBtn.addEventListener('click', () => {
                document.body.removeChild(modal);
                onConfirm();
                playSound(700, 0.1);
            });
            
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    document.body.removeChild(modal);
                    playSound(600, 0.1);
                }
            });
            
            document.body.appendChild(modal);
        }

        // Dark mode detection
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });

        // Initialize the app
        init();
    </script>
</body>
</html>
