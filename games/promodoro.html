<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promodoro</title>
    <link rel="stylesheet" href="promodoro.css">
</head>
<body>
    <div class="container">
        <div id="streakDisplay" style="margin-bottom:1rem; color:#4a4a8a; font-weight:bold;"></div>
        <canvas id="progressChart" width="320" height="120" style="margin-bottom:1rem; background:#f9f9ff; border-radius:8px; display:none;"></canvas>
        <h1>Promodoro Timer</h1>
        <div class="mode">
            <button id="pomodoroBtn" class="active">Pomodoro</button>
            <button id="shortBreakBtn">Short Break</button>
            <button id="longBreakBtn">Long Break</button>
        </div>
        
        <!-- Visual Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar" id="sessionProgress">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-labels">
                <span>0%</span>
                <span>25%</span>
                <span>50%</span>
                <span>75%</span>
                <span>100%</span>
            </div>
        </div>
        
        <div id="timer">25:00</div>
        
        <!-- Visual Streak Counter -->
        <div class="streak-display">
            <div class="streak-icon">🔥</div>
            <div class="streak-count" id="streakCount">0</div>
            <div class="streak-label">Day Streak</div>
        </div>
        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="pauseBtn">Pause</button>
            <button id="resetBtn">Reset</button>
            <button id="summaryBtn">View Summary</button>
            <button id="checkpointBtn">Checkpoint</button>
            <button id="distractionBtn">Log Distraction</button>
            <button id="muteBtn">Mute</button>
        </div>
        
        <!-- Visual Stats Grid -->
        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-icon">🍅</div>
                <div class="stat-value" id="pomodoroCount">0</div>
                <div class="stat-label">Pomodoros</div>
            </div>
            <div class="stat-item">
                <div class="stat-icon">📚</div>
                <div class="stat-value" id="sessionCount">0</div>
                <div class="stat-label">Sessions</div>
            </div>
            <div class="stat-item">
                <div class="stat-icon">🎯</div>
                <div class="stat-value" id="focusPercentage">100%</div>
                <div class="stat-label">Focus</div>
            </div>
        </div>
        
        <!-- Visual Goal Progress -->
        <div class="goal-container" id="goalContainer">
            <div class="goal-header">
                <span>🎯 Current Goal</span>
                <span class="goal-progress" id="goalProgress">0%</span>
            </div>
            <div class="goal-progress-bar">
                <div class="goal-progress-fill" id="goalProgressFill"></div>
            </div>
            <div id="goalDisplay"></div>
        </div>
        
        <!-- Checkpoints with visual indicators -->
        <div class="checkpoints-container">
            <div class="checkpoints-header">
                <span>✅ Checkpoints</span>
                <span class="checkpoints-count" id="checkpointsCount">0</span>
            </div>
            <div id="checkpoints">
                <ul id="checkpointList"></ul>
            </div>
        </div>
    </div>

    <!-- Goal Setting Modal -->
    <div id="goalModal" class="modal">
        <div class="modal-content">
            <p>What is your goal for this session?</p>
            <textarea id="goalText" placeholder="My goal is to..."></textarea>
            <button id="saveGoalBtn">Start Session</button>
        </div>
    </div>

    <!-- Reflection Modal -->
    <div id="reflectionModal" class="modal">
        <div class="modal-content">
            <p id="reflectionPrompt"></p>
            <textarea id="reflectionText" placeholder="My plan to improve focus is..."></textarea>
            <button id="saveReflectionBtn">Start Break</button>
        </div>
    </div>

    <!-- Daily Summary Modal -->
    <div id="summaryModal" class="modal">
        <div class="modal-content">
            <span id="closeSummaryBtn" class="close-btn">&times;</span>
            <div id="summaryContent"></div>
        </div>
    </div>

    <audio id="notificationSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3" preload="auto"></audio>

    <script>
        // --- Get references to all necessary DOM elements ---
        const streakDisplay = document.getElementById('streakDisplay');
        const progressChart = document.getElementById('progressChart');
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const pomodoroBtn = document.getElementById('pomodoroBtn');
        const shortBreakBtn = document.getElementById('shortBreakBtn');
        const longBreakBtn = document.getElementById('longBreakBtn');
        const pomodoroCountElem = document.getElementById('pomodoroCount');
        const sessionCountElem = document.getElementById('sessionCount');
        const distractionCountElem = document.getElementById('distractionCountElem');
        const distractionBtn = document.getElementById('distractionBtn');
        const reflectionModal = document.getElementById('reflectionModal');
        const reflectionPrompt = document.getElementById('reflectionPrompt');
        const reflectionText = document.getElementById('reflectionText');
        const saveReflectionBtn = document.getElementById('saveReflectionBtn');
        const goalModal = document.getElementById('goalModal');
        const goalText = document.getElementById('goalText');
        const saveGoalBtn = document.getElementById('saveGoalBtn');
        const goalDisplay = document.getElementById('goalDisplay');
        const summaryBtn = document.getElementById('summaryBtn');
        const summaryModal = document.getElementById('summaryModal');
        const closeSummaryBtn = document.getElementById('closeSummaryBtn');
        const summaryContent = document.getElementById('summaryContent');
        const checkpointBtn = document.getElementById('checkpointBtn');
        const checkpointList = document.getElementById('checkpointList');
        const muteBtn = document.getElementById('muteBtn');
        const notificationSound = document.getElementById('notificationSound');

        // --- Helper function for safe JSON parsing ---
        function getJSONFromStorage(key) {
            const item = localStorage.getItem(key);
            if (!item) return {}; // Return empty object if item doesn't exist
            try {
                return JSON.parse(item);
            } catch (e) {
                console.error(`Error parsing JSON from localStorage key \"${key}\":`, e);
                return {}; // Return a default empty object on error
            }
        }

        // --- State Variables ---
        let pomodoroCount = Number(localStorage.getItem('pomodoroCount') || 0);
        let sessionCount = Number(localStorage.getItem('sessionCount') || 0);
        let streak = Number(localStorage.getItem('pomodoroStreak') || 0);
        let lastPomodoroDate = localStorage.getItem('lastPomodoroDate') || '';
        let pomodorosPerDay = getJSONFromStorage('pomodorosPerDay');
        let dailyGoals = getJSONFromStorage('dailyGoals');
        let sessionDistractions = 0;
        let sessionPomodoros = 0;
        let lastCompletedDate = localStorage.getItem('lastCompletedDate') || '';

        let checkpoints = [];
        let timer;
        let timeLeft;
        let running = false;
        let currentMode = 'pomodoro';
        let distractionCount = 0;
        let currentGoal = '';
        let isMuted = false;
        let lastUpdateTime = Date.now();
        let sessionStartTime = 0;

        const timeSettings = {
            pomodoro: 1 * 60,
            short: 5 * 60,
            long: 15 * 60
        };

        // --- Core Functions ---
        function updateStreakAndChart(pomodoroCompleted = false) {
            const today = new Date().toISOString().slice(0, 10);
            
            if (pomodoroCompleted) {
                if (lastPomodoroDate && lastPomodoroDate !== today) {
                    const yesterday = new Date(new Date(today).setDate(new Date(today).getDate() - 1)).toISOString().slice(0, 10);
                    if (lastPomodoroDate === yesterday) {
                        streak++;
                    } else {
                        streak = 1;
                    }
                } else if (!lastPomodoroDate) {
                    streak = 1;
                }
                pomodorosPerDay[today] = (pomodorosPerDay[today] || 0) + 1;
                localStorage.setItem('pomodorosPerDay', JSON.stringify(pomodorosPerDay));
                localStorage.setItem('pomodoroStreak', streak);
                localStorage.setItem('lastPomodoroDate', today);
                lastCompletedDate = today;
                localStorage.setItem('lastCompletedDate', today);
                
                // Update streak display with animation
                document.getElementById('streakCount').textContent = streak;
                const streakIcon = document.querySelector('.streak-icon');
                streakIcon.classList.add('celebrate');
                setTimeout(() => streakIcon.classList.remove('celebrate'), 1000);
            }
            
            // Update streak display
            document.getElementById('streakCount').textContent = streak;
            streakDisplay.textContent = streak > 0 ? `🔥 ${streak} day streak!` : 'Start a session to build your streak!';
            
            // Update progress chart
            const ctx = progressChart.getContext('2d');
            progressChart.style.display = 'block';
            ctx.clearRect(0, 0, progressChart.width, progressChart.height);
            const days = Array.from({ length: 7 }, (_, i) => {
                const d = new Date(Date.now() - (6 - i) * 24 * 60 * 60 * 1000);
                return d.toISOString().slice(0, 10);
            });
            const vals = days.map(d => pomodorosPerDay[d] || 0);
            const barW = 32;
            const barMaxHeight = 80;
            const maxVal = Math.max(...vals, 1);
            days.forEach((d, i) => {
                const barHeight = (vals[i] / maxVal) * barMaxHeight;
                ctx.fillStyle = '#8a5cc3';
                ctx.fillRect(i * barW + 10, progressChart.height - barHeight - 20, barW - 6, barHeight);
                ctx.fillStyle = '#e6e6fa';
                ctx.font = '10px "Press Start 2P", cursive';
                ctx.textAlign = 'center';
                ctx.fillText(vals[i], i * barW + (barW/2), progressChart.height - barHeight - 25);
                ctx.fillText(d.slice(5), i * barW + (barW/2), progressChart.height - 5);
            });
            
            // Update stats
            updateSessionStats();
        }

        function updateDisplay() {
            const now = Date.now();
            const deltaTime = now - lastUpdateTime;
            lastUpdateTime = now;
            
            // Update timer display
            const min = String(Math.floor(timeLeft / 60)).padStart(2, '0');
            const sec = String(timeLeft % 60).padStart(2, '0');
            timerDisplay.textContent = `${min}:${sec}`;
            document.title = `${min}:${sec} - ${currentMode.charAt(0).toUpperCase() + currentMode.slice(1)}`;
            
            // Update progress bar
            if (running && currentMode === 'pomodoro') {
                const totalTime = timeSettings.pomodoro;
                const remainingRatio = timeLeft / totalTime;
                const progressPercentage = Math.round((1 - remainingRatio) * 100);
                const progressFill = document.getElementById('progressFill');
                progressFill.style.width = `${progressPercentage}%`;
                progressFill.style.setProperty('--progress', `${progressPercentage}%`);
                
                // Update session stats periodically
                if (now % 5000 < deltaTime) { // Every ~5 seconds
                    updateSessionStats();
                }
            }
        }

        function startTimer() {
            if (running) return;

            if (currentMode === 'pomodoro' && !currentGoal) {
                goalModal.style.display = 'block';
                return;
            }
            
            // Start or resume session
            if (!running) {
                if (timeLeft === timeSettings[currentMode === 'short' ? 'short' : currentMode === 'long' ? 'long' : 'pomodoro']) {
                    // Starting a new session
                    sessionStartTime = Date.now();
                    if (currentMode === 'pomodoro') {
                        sessionPomodoros = 0;
                        sessionDistractions = 0;
                    }
                }
                running = true;
                lastUpdateTime = Date.now();
                
                // Update button states
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                
                // Start the timer
                timer = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timer);
                        running = false;
                        sessionEnded();
                    }
                }, 1000);
                
                // Update display immediately
                updateDisplay();
            }
        }

        function pauseTimer() {
            if (running) {
                running = false;
                clearInterval(timer);
                
                // Update button states
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                
                // Update session stats
                updateSessionStats();
            }
        }

        function resetTimer() {
            // Clear the current timer
            clearInterval(timer);
            running = false;
            
            // Reset button states
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            
            // Reset current goal and display
            currentGoal = '';
            document.getElementById('goalDisplay').textContent = '';
            
            // Reset the timer display
            setMode(currentMode);
            
            // Reset progress bar
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('progressFill').style.setProperty('--progress', '0%');
            
            // Update stats
            updateSessionStats();
        }

        function setMode(mode, autoStart = false) {
            pauseTimer();
            currentMode = mode;
            timeLeft = timeSettings[mode === 'short' ? 'short' : mode === 'long' ? 'long' : 'pomodoro'];
            updateDisplay();

            pomodoroBtn.classList.toggle('active', mode === 'pomodoro');
            shortBreakBtn.classList.toggle('active', mode === 'short');
            longBreakBtn.classList.toggle('active', mode === 'long');

            if (mode === 'pomodoro') {
                distractionBtn.style.display = 'inline-block';
                distractionCount = 0;
            } else {
                distractionBtn.style.display = 'none';
            }
            updateStats();
            resetCheckpoints();

            if (autoStart) {
                startTimer();
            }
        }

        function sessionEnded() {
            playSound();
            
            if (currentMode === 'pomodoro') {
                pomodoroCount++;
                sessionPomodoros++;
                localStorage.setItem('pomodoroCount', pomodoroCount);
                updateStreakAndChart(true);
                
                // Update progress bar to 100%
                document.getElementById('progressFill').style.width = '100%';
                document.getElementById('progressFill').style.setProperty('--progress', '100%');
                
                // Show celebration for completed pomodoro
                const timerDisplay = document.getElementById('timer');
                timerDisplay.classList.add('celebrate');
                setTimeout(() => timerDisplay.classList.remove('celebrate'), 1000);
                
                // Show reflection prompt after 4 pomodoros
                if (pomodoroCount % 4 === 0) {
                    showReflectionPrompt();
                } else {
                    // Short break after pomodoro
                    setMode('short');
                    startTimer();
                }
            } else if (currentMode === 'short' || currentMode === 'long') {
                // Pomodoro after break
                setMode('pomodoro');
                
                // Reset progress bar for new session
                document.getElementById('progressFill').style.width = '0%';
                document.getElementById('progressFill').style.setProperty('--progress', '0%');
                
                // Ask for a new goal if none exists
                if (!currentGoal) {
                    goalModal.style.display = 'block';
                } else {
                    startTimer();
                }
            }
            
            // Update all stats and UI
            updateSessionStats();
            updateCheckpointList();
            
            // Save session data
            sessionCount++;
            localStorage.setItem('sessionCount', sessionCount);
        }
        
        function updateStats() {
            pomodoroCountElem.textContent = pomodoroCount;
            sessionCountElem.textContent = sessionCount;
            distractionCountElem.textContent = distractionCount;
        }

        function saveStats() {
            try {
                localStorage.setItem('pomodoroCount', pomodoroCount);
                localStorage.setItem('sessionCount', sessionCount);
            } catch (e) {
                alert('Could not save stats. Local storage might be full or unavailable.');
            }
        }

        function resetCheckpoints() {
            checkpoints = [];
            checkpointList.innerHTML = '';
        }

        function addCheckpoint() {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            checkpoints.push({
                time: now,
                text: `Checkpoint at ${timeString}`
            });
            
            // Add visual feedback
            const checkpointsList = document.getElementById('checkpointList');
            const newItem = document.createElement('li');
            newItem.textContent = `Checkpoint at ${timeString}`;
            newItem.style.animation = 'fadeIn 0.5s ease-out';
            checkpointsList.prepend(newItem);
            
            // Update stats
            document.getElementById('checkpointsCount').textContent = checkpoints.length;
            
            // Scroll to top of list
            checkpointsList.scrollTop = 0;
            
            playSound();
        }

        function updateSessionStats() {
            // Update pomodoro count
            document.getElementById('pomodoroCount').textContent = pomodoroCount + sessionPomodoros;
            
            // Update session count
            document.getElementById('sessionCount').textContent = sessionCount;
            
            // Calculate and update focus percentage
            const totalSessions = sessionCount + 1;
            const distractionRate = totalSessions > 0 ? (distractionCount + sessionDistractions) / totalSessions : 0;
            const focusPercentage = Math.max(0, 100 - Math.min(100, distractionRate * 50));
            document.getElementById('focusPercentage').textContent = `${Math.round(focusPercentage)}%`;
            
            // Update goal progress
            updateGoalProgress();
            
            // Update checkpoint count
            document.getElementById('checkpointsCount').textContent = checkpoints.length;
            
            // Update checkpoint list
            updateCheckpointList();
        }

        function updateGoalProgress() {
            const goalContainer = document.getElementById('goalContainer');
            const goalProgress = document.getElementById('goalProgress');
            const goalProgressFill = document.getElementById('goalProgressFill');
            
            if (currentGoal) {
                goalContainer.style.display = 'block';
                const goalProgressValue = Math.min(100, (pomodoroCount % 10) * 10);
                goalProgress.textContent = `${goalProgressValue}%`;
                goalProgressFill.style.width = `${goalProgressValue}%`;
                
                // Update goal text
                const goalDisplay = document.getElementById('goalDisplay');
                goalDisplay.textContent = currentGoal;
                goalDisplay.style.display = 'block';
            } else {
                goalContainer.style.display = 'none';
            }
        }

        function updateCheckpointList() {
            const checkpointList = document.getElementById('checkpointList');
            checkpointList.innerHTML = '';
            
            // Show most recent checkpoints first
            const recentCheckpoints = [...checkpoints].reverse().slice(0, 5);
            
            if (recentCheckpoints.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.textContent = 'No checkpoints yet. Click the Checkpoint button to add one!';
                emptyMsg.style.fontSize = '0.7rem';
                emptyMsg.style.color = '#8a5cc3';
                emptyMsg.style.textAlign = 'center';
                emptyMsg.style.padding = '10px';
                checkpointList.appendChild(emptyMsg);
                return;
            }
            
            recentCheckpoints.forEach(checkpoint => {
                const li = document.createElement('li');
                li.textContent = checkpoint.text;
                checkpointList.appendChild(li);
            });
            
            // Update count
            document.getElementById('checkpointsCount').textContent = checkpoints.length;
        }

        // --- Event Listeners ---
        startBtn.onclick = startTimer;
        pauseBtn.onclick = pauseTimer;
        resetBtn.onclick = resetTimer;
        
        pomodoroBtn.onclick = () => setMode('pomodoro');
        shortBreakBtn.onclick = () => setMode('short');
        longBreakBtn.onclick = () => setMode('long');
        
        checkpointBtn.onclick = addCheckpoint;

        distractionBtn.onclick = () => {
            distractionCount++;
            updateStats();
        };

        saveGoalBtn.onclick = () => {
            const goal = goalText.value.trim();
            if (goal) {
                currentGoal = goal;
                goalDisplay.textContent = `Goal: ${currentGoal}`;
                goalModal.style.display = 'none';
                goalText.value = '';
                startTimer(); // Now start the timer
            } else {
                alert('Please set a goal for your session.');
            }
        };

        saveReflectionBtn.onclick = () => {
            reflectionText.value = ''; // Clear textarea
            reflectionModal.style.display = 'none';

            // Now, start the break
            if (pomodoroCount > 0 && pomodoroCount % 4 === 0) {
                setMode('long', true);
            } else {
                setMode('short', true);
            }
        };

        summaryBtn.onclick = () => {
            const today = new Date().toISOString().slice(0, 10);
            const todayData = dailyGoals[today];

            if (!todayData || todayData.pomodoros === 0) {
                summaryContent.innerHTML = '<h3>No Pomodoros completed today.</h3>';
            } else {
                const avgDistractions = (todayData.distractions / todayData.pomodoros).toFixed(1);
                const goalsList = todayData.goals.map(g => `<li>${g}</li>`).join('');
                summaryContent.innerHTML = `
                    <h3>Today's Summary</h3>
                    <p><strong>Total Pomodoros:</strong> ${todayData.pomodoros}</p>
                    <p><strong>Average Distractions:</strong> ${avgDistractions} per session</p>
                    <p><strong>Goals Achieved:</strong></p>
                    <ul>${goalsList}</ul>
                `;
            }
            summaryModal.style.display = 'block';
        };

        closeSummaryBtn.onclick = () => {
            summaryModal.style.display = 'none';
        };

        muteBtn.onclick = () => {
            isMuted = !isMuted;
            muteBtn.textContent = isMuted ? 'Unmute' : 'Mute';
        };

        // --- Initialization on page load ---
        function init() {
            setMode('pomodoro');
            updateStats();
            updateStreakAndChart();
        }

        init();
    </script>
</body>
</html>
