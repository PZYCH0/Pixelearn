<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Teacher Portfolio</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="portfolio.css" />
    <script src="script.js" defer></script>
    <style>
      :root {
        --primary-color: #f953c7;
        --secondary-color: #9a1ae0;
        --text-color: #ffffff;
        --bg-color: rgba(0, 0, 0, 0.6);
        --border-radius: 0px;
        --pixel-border: 4px solid var(--primary-color);
      }

      body {
        background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('10.gif') no-repeat center center/cover;
        font-family: 'Press Start 2P', cursive;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: var(--text-color);
      }

      h1 {
        color: var(--primary-color);
        text-align: center;
        font-size: 2.5rem;
        margin-bottom: 30px;
        text-shadow: 3px 3px 0px #000;
        letter-spacing: 2px;
      }

      .win {
        animation: pixelAnimation 0.5s steps(2) infinite;
      }

      @keyframes pixelAnimation {
        0% { background-color: var(--primary-color); color: black; }
        100% { background-color: var(--secondary-color); color: white; }
      }

      #nameEntry {
        background: var(--bg-color);
        padding: 20px;
        border: var(--pixel-border);
        margin-bottom: 20px;
        width: 100%;
        max-width: 400px;
      }

      #nameEntry form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      label {
        color: var(--primary-color);
        margin-bottom: 5px;
        text-shadow: 2px 2px 0px #000;
      }

      input[type="text"] {
        padding: 12px;
        background: black;
        border: 2px solid var(--primary-color);
        color: var(--primary-color);
        font-family: 'Press Start 2P', cursive;
        font-size: 14px;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: var(--secondary-color);
      }

      button {
        background-color: var(--primary-color);
        color: black;
        border: none;
        padding: 12px 20px;
        cursor: pointer;
        font-family: 'Press Start 2P', cursive;
        font-size: 14px;
        position: relative;
        transition: all 0.1s;
      }

      button:hover {
        background-color: var(--secondary-color);
        transform: translateY(-2px);
      }

      button:active {
        transform: translateY(2px);
      }

      .game-container {
        width: 100%;
        max-width: 600px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .scoreboard {
        background: var(--bg-color);
        padding: 20px;
        border: var(--pixel-border);
        width: 100%;
        display: flex;
        justify-content: space-around;
      }

      .scoreboard p {
        margin: 0;
        font-size: 1rem;
        color: var(--primary-color);
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        background: var(--primary-color);
        padding: 4px;
      }

      .cell {
        background: black;
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        font-weight: bold;
        cursor: pointer;
        color: var(--primary-color);
        transition: all 0.2s;
      }

      .cell:hover {
        background-color: #111;
        box-shadow: inset 0 0 0 2px var(--secondary-color);
      }

      /* Modal style for question box */
      .question-box {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: black;
        padding: 25px;
        border: var(--pixel-border);
        width: 90%;
        max-width: 500px;
        z-index: 1000;
      }

      .question-box::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: -1;
      }

      .question-box form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .question-box p {
        margin: 0;
        font-size: 1rem;
        color: var(--primary-color);
        line-height: 1.5;
      }

      #message {
        margin-top: 20px;
        font-size: 1.2rem;
        color: var(--secondary-color);
        text-align: center;
        text-shadow: 2px 2px 0px #000;
      }

      .hidden {
        display: none !important;
      }

      .timer-container {
        text-align: center;
        margin-bottom: 15px;
      }

      .timer {
        color: var(--secondary-color);
        font-size: 1.2rem;
        padding: 8px;
        border: 2px solid var(--secondary-color);
        display: inline-block;
      }

      @keyframes timerFlash {
        0% { color: var(--secondary-color); }
        50% { color: #ff0000; }
        100% { color: var(--secondary-color); }
      }

      .timer.warning {
        animation: timerFlash 1s infinite;
      }

      .player-turn {
        text-align: center;
        color: var(--primary-color);
        font-size: 1.2rem;
        margin-bottom: 15px;
        padding: 8px;
        border: 2px solid var(--primary-color);
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      #currentPlayerName {
        color: var(--secondary-color);
        font-weight: bold;
      }

      #winScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 2000;
      }

      .win-content {
        text-align: center;
        animation: scaleIn 0.5s ease-out;
      }

      @keyframes scaleIn {
        0% { transform: scale(0); }
        80% { transform: scale(1.1); }
        100% { transform: scale(1); }
      }

      .trophy {
        font-size: 5rem;
        margin-bottom: 20px;
        animation: bounce 1s infinite;
      }

      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }

      .win-text {
        color: var(--primary-color);
        font-size: 2.5rem;
        margin: 0;
        text-shadow: 3px 3px 0 var(--secondary-color);
        animation: glitch 1s infinite;
      }

      @keyframes glitch {
        0% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
        100% { transform: translate(0); }
      }

      .winner-name {
        color: var(--secondary-color);
        font-size: 1.5rem;
        margin: 20px 0;
        text-shadow: 2px 2px 0 black;
      }

      .continue-btn {
        margin-top: 20px;
        padding: 15px 30px;
        font-size: 1.2rem;
        background-color: var(--secondary-color);
        border: 2px solid var(--primary-color);
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }

      .firework {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      .firework:nth-child(1) {
        background: var(--primary-color);
        animation: firework1 1.5s infinite;
      }

      .firework:nth-child(2) {
        background: var(--secondary-color);
        animation: firework2 1.7s infinite;
      }

      .firework:nth-child(3) {
        background: var(--text-color);
        animation: firework3 1.9s infinite;
      }

      @keyframes firework1 {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(-100px, -100px) scale(0); opacity: 0; }
      }

      @keyframes firework2 {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(100px, -100px) scale(0); opacity: 0; }
      }

      @keyframes firework3 {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(0, -150px) scale(0); opacity: 0; }
      }

      @media (max-width: 768px) {
        body {
          padding: 10px;
        }

        h1 {
          font-size: 1.5rem;
        }

        .game-container {
          width: 95%;
        }

        .cell {
          font-size: 2rem;
        }

        .question-box {
          width: 95%;
          padding: 15px;
        }
      }
    </style>
  </head>
  <body>
 
    <h1>Gap-Fill Tic-Tac-Toe</h1>
    <div id="nameEntry">
      <form action="javascript:void(0)">
        <label for="playerX">Player X Name:</label>
        <input type="text" id="playerX" placeholder="Enter name" />
        <label for="playerO">Player O Name:</label>
        <input type="text" id="playerO" placeholder="Enter name" />
        <button type="submit" onclick="startGame()">Start Game</button>
      </form>
    </div>
    <div class="game-container">
      <div class="scoreboard hidden">
        <p><span id="nameX">Player X</span>: <span id="scoreX">0</span></p>
        <p><span id="nameO">Player O</span>: <span id="scoreO">0</span></p>
      </div>
      <div class="board hidden" id="board"></div>
    </div>
    <div class="question-box hidden">
      <form action="javascript:void(0)">
        <div class="player-turn">
          <span id="currentPlayerName">Player X</span>'s Turn
        </div>
        <div class="timer-container">
          <div class="timer">Time left: <span id="timer">30</span>s</div>
        </div>
        <p id="question"></p>
        <p><strong>Verb:</strong> <span id="verb"></span></p>
        <p><strong>Tense:</strong> <span id="tense"></span></p>
        <input type="text" id="answer" placeholder="Enter the missing word" />
        <button type="submit" onclick="checkAnswer()">Submit</button>
        <p id="feedback" style="color: red"></p>
      </form>
    </div>
    <div id="winScreen" class="hidden">
      <div class="win-content">
        <div class="trophy">🏆</div>
        <h2 class="win-text">VICTORY!</h2>
        <p class="winner-name">Player wins!</p>
        <div class="firework"></div>
        <div class="firework"></div>
        <div class="firework"></div>
        <button onclick="closeWinScreen()" class="continue-btn">Continue</button>
      </div>
    </div>
    <p id="message"></p>
    <script>
      let board = Array(9).fill(null);
      let currentPlayer = "X";
      let selectedCell = null;
      let roundsWon = { X: 0, O: 0 };
      let timerInterval = null;
      let timeLeft = 30;
      const boardDiv = document.getElementById("board");
      const scoreX = document.getElementById("scoreX");
      const scoreO = document.getElementById("scoreO");
      const nameX = document.getElementById("nameX");
      const nameO = document.getElementById("nameO");
      const timerElement = document.getElementById("timer");

      function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 30;
        timerElement.textContent = timeLeft;
        timerElement.parentElement.classList.remove('warning');
        
        timerInterval = setInterval(() => {
          timeLeft--;
          timerElement.textContent = timeLeft;
          
          if (timeLeft <= 10) {
            timerElement.parentElement.classList.add('warning');
          }
          
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            document.getElementById("feedback").textContent = "Time's up! You lose your turn.";
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            document.querySelector(".question-box").classList.add("hidden");
            renderBoard();
          }
        }, 1000);
      }

      function startGame() {
        const playerXName =
          document.getElementById("playerX").value || "Player X";
        const playerOName =
          document.getElementById("playerO").value || "Player O";
        nameX.textContent = playerXName;
        nameO.textContent = playerOName;
        document.getElementById("nameEntry").classList.add("hidden");
        document.querySelector(".scoreboard").classList.remove("hidden");
        boardDiv.classList.remove("hidden");
        renderBoard();
      }

      function renderBoard() {
        boardDiv.innerHTML = "";
        board.forEach((cell, index) => {
          const cellDiv = document.createElement("div");
          cellDiv.classList.add("cell");
          cellDiv.textContent = cell || "";
          cellDiv.onclick = () => selectCell(index);
          boardDiv.appendChild(cellDiv);
        });
      }

      function selectCell(index) {
        if (board[index] !== null) return;
        selectedCell = index;
        askQuestion();
      }

      function askQuestion() {
        const randomIndex = Math.floor(Math.random() * questions.length);
        const question = questions[randomIndex];
        const currentPlayerName = currentPlayer === "X" ? 
          (document.getElementById("playerX").value || "Player X") : 
          (document.getElementById("playerO").value || "Player O");
        
        document.getElementById("currentPlayerName").textContent = currentPlayerName;
        document.getElementById("question").textContent = question.sentence;
        document.getElementById("verb").textContent = question.verb;
        document.getElementById("tense").textContent = question.tense;
        document.getElementById("answer").value = "";
        document.getElementById("feedback").textContent = "";
        document.querySelector(".question-box").classList.remove("hidden");
        document.getElementById("answer").dataset.correct = question.answer;
        startTimer();
      }

      function checkAnswer() {
        clearInterval(timerInterval);
        const userAnswer = document.getElementById("answer").value.trim();
        const correctAnswer = document.getElementById("answer").dataset.correct;
        if (userAnswer.toLowerCase() === correctAnswer.toLowerCase()) {
          board[selectedCell] = currentPlayer;
          checkWin();
        } else {
          document.getElementById("feedback").textContent = "Incorrect! You lose your turn.";
        }
        currentPlayer = currentPlayer === "X" ? "O" : "X";
        renderBoard();
        document.querySelector(".question-box").classList.add("hidden");
      }

      function checkWin() {
        const winningCombinations = [
          [0, 1, 2],
          [3, 4, 5],
          [6, 7, 8],
          [0, 3, 6],
          [1, 4, 7],
          [2, 5, 8],
          [0, 4, 8],
          [2, 4, 6],
        ];

        for (const combination of winningCombinations) {
          const [a, b, c] = combination;
          if (board[a] && board[a] === board[b] && board[a] === board[c]) {
            const winner = currentPlayer === "X" ? 
              (document.getElementById("playerX").value || "Player X") : 
              (document.getElementById("playerO").value || "Player O");
            
            document.getElementById("message").textContent = `${winner} wins this round!`;
            roundsWon[currentPlayer]++;
            updateScoreboard();
            
            document.querySelectorAll(".cell")[a].classList.add("win");
            document.querySelectorAll(".cell")[b].classList.add("win");
            document.querySelectorAll(".cell")[c].classList.add("win");
            
            // Montrer l'écran de victoire
            setTimeout(() => {
              showWinScreen(winner);
            }, 1000);
            
            setTimeout(() => {
              resetBoard();
            }, 1500);
            return;
          }
        }
      }

      function updateScoreboard() {
        scoreX.textContent = roundsWon.X;
        scoreO.textContent = roundsWon.O;
      }

      function resetBoard() {
        clearInterval(timerInterval);
        board.fill(null);
        renderBoard();
      }

      function showWinScreen(winner) {
        const winScreen = document.getElementById('winScreen');
        const winnerName = winScreen.querySelector('.winner-name');
        winnerName.textContent = `${winner} WINS!`;
        winScreen.classList.remove('hidden');
        
        // Ajouter un effet sonore de victoire si vous le souhaitez
        // const winSound = new Audio('win.mp3');
        // winSound.play();
      }

      function closeWinScreen() {
        document.getElementById('winScreen').classList.add('hidden');
      }

      // Array of question objects//
      const questions = [
          // Verb: Eat (1-4)
  {
    sentence: "She _____ breakfast every morning.",
    verb: "eat",
    tense: "present simple",
    answer: "eats",
  },
  {
    sentence: "They _____ dinner last night.",
    verb: "eat",
    tense: "past simple",
    answer: "ate",
  },
  {

    verb: "eat",

    answer: "eating",
  },
  {

    tense: "past perfect",

  },

    answer: "ran",
  },
  {

    verb: "run",
    tense: "present continuous",
    answer: "running",
  },
  {

    answer: "swims",
  },
  {

    tense: "past simple",
    answer: "swam",
  },
  {
    sentence: "He is _____ in the pool right now.",
    verb: "swim",
    tense: "present continuous",

  },
  {
    sentence: "I _____ across the bay before the storm hit.",

  // Verb: Speak (13-16)
  {

    verb: "speak",

  },
  {

  {

  {

  {

  {

  },
  {

  // Verb: Come (29-32)
  {

  {
