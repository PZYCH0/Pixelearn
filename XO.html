      // Initialize the game//
      function startGame() {
        const playerXName =
          document.getElementById("playerX").value || "Player X";
        const playerOName =
          document.getElementById("playerO").value || "Player O";
        nameX.textContent = playerXName;
        nameO.textContent = playerOName;
        document.getElementById("nameEntry").classList.add("hidden");
        document.querySelector(".scoreboard").classList.remove("hidden");
        boardDiv.classList.remove("hidden");
        renderBoard();
      }

      function renderBoard() {
        boardDiv.innerHTML = "";
        board.forEach((cell, index) => {
          const cellDiv = document.createElement("div");
          cellDiv.classList.add("cell");
          cellDiv.textContent = cell || "";
          cellDiv.onclick = () => selectCell(index);
          boardDiv.appendChild(cellDiv);
        });
      }

      function selectCell(index) {
        if (board[index] !== null) return;
        selectedCell = index;
        askQuestion();
      }

      function askQuestion() {
        const randomIndex = Math.floor(Math.random() * questions.length);
        const question = questions[randomIndex];
        document.getElementById("question").textContent = question.sentence;
        document.getElementById("verb").textContent = question.verb;
        document.getElementById("tense").textContent = question.tense;
        document.getElementById("answer").value = "";
        document.getElementById("feedback").textContent = "";
        document.querySelector(".question-box").classList.remove("hidden");
        document.getElementById("answer").dataset.correct = question.answer;
      }

      function checkAnswer() {
        const userAnswer = document.getElementById("answer").value.trim();
        const correctAnswer = document.getElementById("answer").dataset.correct;
        if (userAnswer.toLowerCase() === correctAnswer.toLowerCase()) {
          board[selectedCell] = currentPlayer;
          checkWin();
        } else {
          document.getElementById("feedback").textContent =
            "Incorrect! You lose your turn.";
        }
        currentPlayer = currentPlayer === "X" ? "O" : "X";
        renderBoard();
        document.querySelector(".question-box").classList.add("hidden");
      }

      function checkWin() {
        const winningCombinations = [
          [0, 1, 2],
          [3, 4, 5],
          [6, 7, 8],
          [0, 3, 6],
          [1, 4, 7],
          [2, 5, 8],
          [0, 4, 8],
          [2, 4, 6],
        ];

        for (const combination of winningCombinations) {
          const [a, b, c] = combination;
          if (board[a] && board[a] === board[b] && board[a] === board[c]) {
            document.getElementById("message").textContent = `${
              nameX.textContent === "Player X" ? "Player X" : nameX.textContent
            } wins this round!`;
            roundsWon[currentPlayer]++;
            updateScoreboard();
            document.querySelectorAll(".cell")[a].classList.add("win");
            document.querySelectorAll(".cell")[b].classList.add("win");
            document.querySelectorAll(".cell")[c].classList.add("win");
            resetBoard();
            return;
          }
        }
      }

      function updateScoreboard() {
        scoreX.textContent = roundsWon.X;
        scoreO.textContent = roundsWon.O;
      }

      function resetBoard() {
        board.fill(null);
        renderBoard();
      }

    <style>
      :root {
        --primary-color: #f953c763;
        --secondary-color: #7a1ab5;
        --text-color: #ffffff;
        --bg-color: rgba(0, 0, 0, 0.8);
        --border-radius: 0px;
        --pixel-border: 4px solid var(--primary-color);
      }

      body {
        background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('10.gif') no-repeat center center/cover;
        font-family: 'Press Start 2P', cursive;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: var(--text-color);
      }

      h1 {
        color: var(--primary-color);
        text-align: center;
        font-size: 2.5rem;
        margin-bottom: 30px;
        text-shadow: 3px 3px 0px #000;
        letter-spacing: 2px;
      }

      .win {
        animation: pixelAnimation 0.5s steps(2) infinite;
      }

      @keyframes pixelAnimation {
        0% { background-color: var(--primary-color); color: black; }
        100% { background-color: var(--secondary-color); color: white; }
      }

      #nameEntry {
        background: var(--bg-color);
        padding: 20px;
        border: var(--pixel-border);
        margin-bottom: 20px;
        width: 100%;
        max-width: 400px;
      }

      #nameEntry form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      label {
        color: var(--primary-color);
        margin-bottom: 5px;
        text-shadow: 2px 2px 0px #000;
      }

      input[type="text"] {
        padding: 12px;
        background: black;
        border: 2px solid var(--primary-color);
        color: var(--primary-color);
        font-family: 'Press Start 2P', cursive;
        font-size: 14px;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: var(--secondary-color);
      }

      button {
        background-color: var(--primary-color);
        color: black;
        border: none;
        padding: 12px 20px;
        cursor: pointer;
        font-family: 'Press Start 2P', cursive;
        font-size: 14px;
        position: relative;
        transition: all 0.1s;
      }

      button:hover {
        background-color: var(--secondary-color);
        transform: translateY(-2px);
      }

      button:active {
        transform: translateY(2px);
      }

      .game-container {
        width: 100%;
        max-width: 600px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .scoreboard {
        background: var(--bg-color);
        padding: 20px;
        border: var(--pixel-border);
        width: 100%;
        display: flex;
        justify-content: space-around;
      }

      .scoreboard p {
        margin: 0;
        font-size: 1rem;
        color: var(--primary-color);
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        background: var(--primary-color);
        padding: 4px;
      }

      .cell {
        background: black;
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        font-weight: bold;
        cursor: pointer;
        color: var(--primary-color);
        transition: all 0.2s;
      }
